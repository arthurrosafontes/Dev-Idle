<html lang="pt-BR">

<meta name="theme-color" content="#1d2147">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mini Dev Studio 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd86b;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0}
#wrap{position:absolute;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;z-index:3;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.92);color:#2a2a4a;border-radius:999px;padding:6px 12px;font-weight:900;font-size:17px;
  display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#money{font-size:20px;min-width:108px;color:#2e7d32}
#deliv{font-size:14px}
.spacer{flex:1}
.btn{border:0;border-radius:14px;padding:9px 13px;font-weight:900;font-size:15px;color:#2a2a4a;
  background:#ffe066;box-shadow:0 4px 0 #c9a227;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c9a227}
.btn.purple{background:#b39ddb;box-shadow:0 4px 0 #7e57c2;color:#fff}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.45}
#shopBtn{position:relative}
#shopBtn .dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#ff5252;display:none;border:2px solid #fff}
#zoomBtn{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 60px);z-index:3;font-size:18px;padding:8px 11px}
#tip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);
  background:rgba(30,30,60,.82);padding:9px 15px;border-radius:999px;font-weight:800;font-size:14px;
  pointer-events:none;white-space:nowrap;transition:opacity .3s;z-index:3}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-20px);opacity:0;transition:.35s;
  background:#fff;color:#2a2a4a;padding:10px 16px;border-radius:14px;font-weight:900;font-size:15px;
  pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center;max-width:90%;z-index:4}
#toast.show{opacity:1;transform:translate(-50%,0)}
#floats{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.fl{position:absolute;font-weight:900;font-size:19px;color:#ffe066;text-shadow:0 2px 0 #6b4f00,0 0 6px rgba(0,0,0,.4);white-space:nowrap;transform:translate(-50%,-50%)}
#joy{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:rgba(255,255,255,.22);
  border:3px solid rgba(255,255,255,.5);display:none;z-index:2;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:10}
.modal.open{display:flex}
.sheet{width:100%;max-height:84%;overflow:auto;background:#2b2f66;border-radius:22px 22px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 4px;font-size:21px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3{margin:14px 0 8px;font-size:14px;opacity:.7;text-transform:uppercase;letter-spacing:.06em}
.sub{opacity:.75;font-size:13px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.item .ic{font-size:30px;width:40px;text-align:center}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:900;font-size:15px}
.item .ds{font-size:12px;opacity:.78;margin-top:2px}
.item .lv{font-size:11px;opacity:.6;margin-top:3px}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#69f0ae}
.item .btn{min-width:86px;font-size:14px}
.close{background:rgba(255,255,255,.15);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.big{width:100%;padding:14px;font-size:17px;margin-top:12px}
.center{text-align:center}
#loading{position:fixed;inset:0;background:#1d2147;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;font-weight:900;font-size:22px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="pill" id="money">💵 $0</div>
    <div class="pill" id="deliv">📦 0</div>

    <button class="btn" id="shopBtn">🛒 Loja<span class="dot"></span></button>
    <button class="btn purple" id="cfgBtn">⚙️</button>
  </div>
  <div id="floats"></div>
  <div id="joy"><div id="knob"></div></div>
  <button class="btn ghost" id="zoomBtn">🔍</button>
  <div id="tip"></div>
  <div id="toast"></div>
</div>
<div id="loading">🧑‍💻 Mini Dev Studio<div style="font-size:14px;opacity:.6;margin-top:10px">carregando…</div></div>

<div class="modal" id="shop"><div class="sheet">
  <h2>🛒 Loja <button class="close" data-close>✕</button></h2>
  <div id="shopList"></div>
</div></div>
<div class="modal" id="wM"><div class="sheet" id="wBody"></div></div>
<div class="modal" id="cfg"><div class="sheet">
  <h2>⚙️ Ajustes <button class="close" data-close>✕</button></h2>
  <div id="stats"></div>
  <button class="btn ghost big" id="sndBtn">🔊 Som: ligado</button>
  <button class="btn ghost big" id="resetBtn">🗑️ Apagar progresso</button>
  <div class="sub center" style="margin-top:14px">Arraste o dedo em qualquer lugar para andar.<br>Pare em cima dos quadros com preço para comprar.<br>Toque num dev/IA para evoluir.</div>
</div></div>
<div class="modal" id="offM"><div class="sheet center">
  <h2 style="justify-content:center">🌙 Bem-vindo de volta!</h2>
  <p id="offTxt"></p>
  <button class="btn big" id="offBtn">Coletar</button>
</div></div>

<script type="module">
import * as THREE from './three.module.min.js';
const $ = id => document.getElementById(id);

// =================== DADOS ===================

    { n: 'IA Mobile',   lang: 'Agente de apps',  t: ALL,             sp: 1.2,  p: 4500,   ai: '#ff4081' }] },
  { room: 2, name: 'Mesa Games', seats: [

    { n: 'Dev Unreal',  lang: 'C++ / Unreal',    t: ['jogo', 'app'], sp: 1.1,  p: 14000,  shirt: '#1a237e' },
    { n: 'IA Game',     lang: 'Agente de games', t: ALL,             sp: 1.4,  p: 22000,  ai: '#76ff03' }] },
  { room: 3, name: 'Mesa Backend', seats: [
    { n: 'Dev Go',      lang: 'Go',              t: ['api'],         sp: 1.1,  p: 28000,  shirt: '#00add8' },
    { n: 'Dev Rust',    lang: 'Rust',            t: ['api', 'jogo'], sp: 1.3,  p: 38000,  shirt: '#b7410e' },
    { n: 'DevOps',      lang: 'Docker / K8s',    t: ['api', 'site'], sp: 1.3,  p: 50000,  shirt: '#326ce5' },
    { n: 'Agente IA',   lang: 'Multi-agente',    t: ALL,             sp: 1.8,  p: 70000,  ai: '#7c4dff' }] },
  { room: 4, name: 'Mesa IA', seats: [
    { n: 'Cientista ML', lang: 'PyTorch',        t: ['ia'],          sp: 1.2,  p: 110000, shirt: '#ee4c2c' },
    { n: 'Eng. de LLM', lang: 'Python / RAG',    t: ['ia', 'api'],   sp: 1.4,  p: 160000, shirt: '#10a37f' },
    { n: 'Cluster GPU', lang: 'CUDA',            t: ['ia', 'jogo'],  sp: 2.2,  p: 240000, ai: '#76b900' },
    { n: 'Super IA',    lang: 'AGI',             t: ALL,             sp: 3,    p: 400000, ai: '#ffd600' }] },
];
TABLES.forEach((T, i) => { if (T.tz === undefined) { const R = ROOMS[T.room]; T.tz = (R.z0 + R.z1) / 2 + 0.2; } });
const SEATS = [];
TABLES.forEach((T, ti) => T.seats.forEach((s, k) => { s.ti = ti; s.k = k; s.idx = SEATS.length; s.x = -2.4 + k * 1.6; SEATS.push(s); }));
const SKINS = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac'];
const HAIRS = ['#3e2723', '#212121', '#6d4c41', '#d7a35b', '#b71c1c', '#424242', '#ff8a65'];
SEATS.forEach((s, i) => { s.skin = SKINS[(i * 3) % 5]; s.hair = HAIRS[(i * 5) % HAIRS.length]; });
const INMAX = 8, OUTMAX = 12, DQMAX = 3, DDMAX = 6;
const PRINTER = { x: -3.6, z: -4.75 }, DESK = { x: 3.6, z: -4.7 }, COUNTER = { x: 0, z: 4.4 };
const SHOP = [
  { sec: 'Você', k: 'bag',    ic: '🎒', nm: 'Mochila maior',    ds: '+1 item carregado',              base: 40,  mul: 2.3, max: 10 },
  { sec: 'Você', k: 'coffee', ic: '☕', nm: 'Café forte',       ds: 'Você programa +30% mais rápido',  base: 50,  mul: 2.4, max: 10 },
  { sec: 'Você', k: 'mypc',   ic: '💻', nm: 'Seu PC gamer',     ds: '+35% velocidade na sua mesa',     base: 80,  mul: 2.2, max: 10 },
  { sec: 'Você', k: 'shoes',  ic: '👟', nm: 'Tênis de corrida', ds: '+12% velocidade de andar',        base: 60,  mul: 2.2, max: 8 },
  { sec: 'Estúdio', k: 'mkt',    ic: '📣', nm: 'Marketing',     ds: '+25% valor e mais pedidos',       base: 150, mul: 2.6, max: 12 },
  { sec: 'Estúdio', k: 'intern', ic: '🧑‍🎓', nm: 'Estagiário', ds: 'Leva pedidos às mesas e entrega sozinho (ganha até offline)', costs: [300, 3000, 25000, 150000, 600000], max: 5 },
];
const SAVE_KEY = 'minidevstudio3d_v1';

// =================== ESTADO ===================
function defS() {
  return { money: 0, delivered: 0, earned: 0, rooms: 1, roomPaid: ROOMS.map(() => 0), lv: SEATS.map(() => 0), paid: SEATS.map(() => 0),
    up: { bag: 0, shoes: 0, coffee: 0, mypc: 0, mkt: 0, intern: 0 }, autoRate: 0, sound: true, t: Date.now(), types: ['site'], zoom: 1 };
}
let S = defS();
let TR = TABLES.map(() => ({ in: [], out: [] }));
let WK = SEATS.map(() => ({ job: null, prog: 0, state: 'idle' }));
let desk = { q: [], d: [], prog: 0 };
let inbox = [];
let offlineGain = 0, savedStack = [];
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return;
    const d = JSON.parse(raw), def = defS();
    S = Object.assign(def, d.S); S.up = Object.assign(defS().up, d.S.up || {});
    ['lv', 'paid', 'roomPaid'].forEach(k => { const a = defS()[k]; (d.S[k] || []).forEach((v, i) => { if (i < a.length) a[i] = v; }); S[k] = a; });
    S.rooms = Math.max(1, Math.min(ROOMS.length, S.rooms));
    (d.TR || []).forEach((x, i) => { if (TR[i]) { TR[i].in = x.in || []; TR[i].out = x.out || []; } });
    (d.WK || []).forEach((x, i) => { if (WK[i] && x) { WK[i].job = x.job || null; WK[i].prog = x.prog || 0; } });
    desk = Object.assign(desk, d.desk || {}); inbox = d.inbox || []; savedStack = d.stack || [];
    const away = (Date.now() - (d.S.t || Date.now())) / 1000;
    if (away > 60 && S.up.intern > 0 && S.autoRate > 0) offlineGain = Math.floor(S.autoRate * Math.min(away, 4 * 3600) * 0.5);
  } catch (e) { }
}
function save() {
  S.t = Date.now();
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ S, TR, WK: WK.map(w => ({ job: w.job, prog: w.prog })), desk, inbox,
      stack: player ? player.stack.concat(...interns.map(n => n.stack)).slice(0, 40) : [] }));
  } catch (e) { }
}

// =================== HELPERS ===================
function fmt(n) {
  n = Math.floor(n); if (n < 1000) return '$' + n;
  const u = ['K', 'M', 'B', 'T']; let i = -1, x = n;
  while (x >= 1000 && i < 3) { x /= 1000; i++; }
  return '$' + (x < 10 ? x.toFixed(2) : x < 100 ? x.toFixed(1) : Math.floor(x)) + u[i];
}
const dist = (a, x, z) => Math.hypot(a.x - x, a.z - z);
const capOf = e => e.isPlayer ? 2 + S.up.bag : 3 + Math.floor(S.up.bag / 2);
const seatSpeed = s => s.sp * (1 + 0.35 * (S.lv[s.idx] - 1));
const meSpeed = () => (1 + 0.3 * S.up.coffee) * (1 + 0.35 * S.up.mypc);
const upCost = s => Math.floor(s.p * 0.5 * Math.pow(1.65, S.lv[s.idx] - 1));
function shopCost(it) { const l = S.up[it.k]; if (l >= it.max) return Infinity; return it.costs ? it.costs[l] : Math.floor(it.base * Math.pow(it.mul, l)); }
const tableTypes = ti => { const set = new Set(); TABLES[ti].seats.forEach(s => { if (S.lv[s.idx] > 0) s.t.forEach(t => set.add(t)); }); return set; };
function availTypes() { const set = new Set(['site']); SEATS.forEach(s => { if (S.lv[s.idx] > 0 && s.t !== ALL) s.t.forEach(t => set.add(t)); }); return ALL.filter(t => set.has(t)); }
const tableCanTake = (ti, t) => TABLES[ti].room < S.rooms && TR[ti].in.length < INMAX && tableTypes(ti).has(t);
const anyTableFor = t => TABLES.some((T, ti) => tableCanTake(ti, t));
function newOrder() {
  const av = availTypes(), t = av[Math.floor(Math.random() * av.length)], T = TYPES[t];
  return { t, w: T.work * (0.85 + Math.random() * 0.3), v: Math.round(T.val * (1 + 0.25 * S.up.mkt) * (0.85 + Math.random() * 0.4)), c: T.cl[Math.floor(Math.random() * T.cl.length)] };
}
const rankName = (s, lv) => s.ai ? `v${lv}.0` : lv <= 2 ? 'Júnior' : lv <= 5 ? 'Pleno' : lv <= 8 ? 'Sênior' : 'Tech Lead';

// =================== SOM ===================
let AC = null;
function initAudio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { } }
function tone(f, d, type = 'sine', v = 0.06, delay = 0) {
  if (!AC || !S.sound) return;
  try { const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) { }
}
let lastCash = 0;
function sfx(k) {
  if (k === 'pick') tone(660, 0.07, 'triangle', 0.05);
  else if (k === 'drop') tone(440, 0.07, 'triangle', 0.05);
  else if (k === 'done') tone(880, 0.1, 'sine', 0.025);
  else if (k === 'cash') { const n = performance.now(); if (n - lastCash < 70) return; lastCash = n; tone(988, 0.07, 'square', 0.03); tone(1319, 0.12, 'square', 0.03, 0.06); }
  else if (k === 'coin') tone(320 + Math.random() * 90, 0.04, 'square', 0.02);
  else if (k === 'buy') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.06, i * 0.08));
}

// =================== THREE ===================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const cvs = renderer.domElement; $('wrap').prepend(cvs);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#a6dc6e');
const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 200);
const EL = 42 * Math.PI / 180, YAW = 0.32, CAMV = new THREE.Vector3(Math.sin(YAW) * Math.cos(EL), Math.sin(EL), Math.cos(YAW) * Math.cos(EL)).multiplyScalar(40);
const RIGHT = new THREE.Vector3(Math.cos(YAW), 0, -Math.sin(YAW));
scene.add(new THREE.HemisphereLight('#ffffff', '#d9c7a5', 2.2));
const sun = new THREE.DirectionalLight('#fff6e8', 2.0);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 70 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const grad = new THREE.DataTexture(new Uint8Array([150, 150, 150, 255, 215, 215, 215, 255, 255, 255, 255, 255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const MC = new Map();
const M = c => { if (!MC.has(c)) MC.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: grad })); return MC.get(c); };
const BC = new Map();
const MB = c => { if (!BC.has(c)) BC.set(c, new THREE.MeshBasicMaterial({ color: c })); return BC.get(c); };
const OL = new THREE.MeshBasicMaterial({ color: '#2b2433', side: THREE.BackSide });
const GC = new Map(); const geo = (k, f) => { if (!GC.has(k)) GC.set(k, f()); return GC.get(k); };
const G = {
  box: (w, h, d) => geo(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d)),
  sph: r => geo('s' + r, () => new THREE.SphereGeometry(r, 22, 16)),

// =================== GRID / A* ===================
const GX0 = -6, GZ0 = -30, GS = 0.5, GW = 24, GH = 72;
let grid = new Uint8Array(GW * GH);
function inRooms(x, z) { if (x < -6 || x > 6) return false; for (let r = 0; r < S.rooms; r++) { const R = ROOMS[r]; if (z >= R.z0 && z <= R.z1) return true; } return false; }
function canStand(x, z, r) {
  if (!inRooms(x - r, z - r) || !inRooms(x + r, z - r) || !inRooms(x - r, z + r) || !inRooms(x + r, z + r)) return false;
  for (const o of obstacles) if (x + r > o.x0 && x - r < o.x1 && z + r > o.z0 && z - r < o.z1) return false;
  return true;
}
function rebuildGrid() { for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) grid[j * GW + i] = canStand(GX0 + (i + 0.5) * GS, GZ0 + (j + 0.5) * GS, 0.3) ? 1 : 0; }
const cellOf = (x, z) => [Math.max(0, Math.min(GW - 1, Math.floor((x - GX0) / GS))), Math.max(0, Math.min(GH - 1, Math.floor((z - GZ0) / GS)))];
function nearestFree(i, j) { if (grid[j * GW + i]) return [i, j]; for (let r = 1; r < 6; r++) for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) { const a = i + di, b = j + dj; if (a >= 0 && b >= 0 && a < GW && b < GH && grid[b * GW + a]) return [a, b]; } return null; }

function findPath(sx, sz, tx, tz) {
  const s = nearestFree(...cellOf(sx, sz)), t = nearestFree(...cellOf(tx, tz)); if (!s || !t) return null;
  const N = GW * GH, gS = new Float32Array(N).fill(1e9), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const si = s[1] * GW + s[0], tiI = t[1] * GW + t[0]; gS[si] = 0;
  const open = [[0, si]];
  const h = k => Math.hypot((k % GW) - t[0], Math.floor(k / GW) - t[1]);
  while (open.length) {
    let bi = 0; for (let k = 1; k < open.length; k++) if (open[k][0] < open[bi][0]) bi = k;
    const [, cur] = open.splice(bi, 1)[0]; if (closed[cur]) continue; closed[cur] = 1;
    if (cur === tiI) break;
    const ci = cur % GW, cj = Math.floor(cur / GW);
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue; const a = ci + di, b = cj + dj; if (a < 0 || b < 0 || a >= GW || b >= GH) continue;
      const k = b * GW + a; if (!grid[k] || closed[k]) continue;
      if (di && dj && (!grid[cj * GW + a] || !grid[b * GW + ci])) continue;
      const ng = gS[cur] + (di && dj ? 1.414 : 1); if (ng < gS[k]) { gS[k] = ng; came[k] = cur; open.push([ng + h(k), k]); }
    }

  const pts = []; let k = tiI; while (k !== si && k >= 0) { pts.push({ x: GX0 + ((k % GW) + 0.5) * GS, z: GZ0 + (Math.floor(k / GW) + 0.5) * GS }); k = came[k]; }

  return out;
}

  const dk = desk.working ? desk.q[0].t : 'idle'; if (deskScreen.userData.k !== dk) { deskScreen.userData.k = dk; deskScreen.material.map = screenTex(dk); deskScreen.material.needsUpdate = true; }
  if (!desk.working && desk.q.length && !player.moving) setBubble(deskBubble, '⌨️'); else if (desk.q.length && !desk.working) setBubble(deskBubble, '⌨️'); else setBubble(deskBubble, null);
  deskBubble.g.position.set(DESK.x, 2.4 + Math.sin(time * 4) * 0.08, DESK.z);
  // pads
  padT -= dt; if (padT <= 0) { padT = 0.1; activePads.forEach(p => drawPadState(p, Math.abs(player.x - p.x) < p.half && Math.abs(player.z - p.z) < p.half)); }
  // pop / crescer salas
  for (let i = popping.length - 1; i >= 0; i--) { const m = popping[i]; const s = m.scale.x + (1 - m.scale.x) * Math.min(1, dt * 14); m.scale.setScalar(s); if (s > 0.98) { m.scale.setScalar(1); popping.splice(i, 1); } }
  roomGroups.forEach(g => { if (g && g.userData.grow < 1) { g.userData.grow = Math.min(1, g.userData.grow + dt * 1.8); const t = g.userData.grow, e = 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2); g.scale.y = Math.max(0.01, e); } });
  // confete
  for (let i = confetti.length - 1; i >= 0; i--) { const c = confetti[i]; c.t += dt; c.vy -= 9 * dt; c.m.position.x += c.vx * dt; c.m.position.y = Math.max(0.03, c.m.position.y + c.vy * dt); c.m.position.z += c.vz * dt; c.vx *= 0.98; c.vz *= 0.98; c.m.rotation.set(c.r + c.t * 8, c.t * 6, 0); if (c.t > 1.6) { scene.remove(c.m); confetti.splice(i, 1); } }
  // floats
  const r = cvs.getBoundingClientRect();
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; const v = f.p.clone(); v.y += f.t * 1.4; v.project(camera); f.el.style.left = ((v.x + 1) / 2 * r.width) + 'px'; f.el.style.top = ((1 - v.y) / 2 * r.height) + 'px'; f.el.style.opacity = Math.max(0, 1 - f.t / 1.2); if (f.t > 1.2) { f.el.remove(); floats.splice(i, 1); } }
  // dica
  const h = hint(); arrow.visible = !!h;
  if (h) { arrow.position.set(h.x, h.y + 0.6 + Math.abs(Math.sin(time * 5)) * 0.35, h.z); arrow.rotation.y = time * 2; }
  setTip(h ? h.tip : '');
}

let hudT = 0;
function hud(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = 0.1;
  $('money').textContent = '💵 ' + fmt(S.money); $('deliv').textContent = '📦 ' + S.delivered;
  $('shopBtn').querySelector('.dot').style.display = SHOP.some(it => S.money >= shopCost(it)) ? 'block' : 'none';
  if ($('shop').classList.contains('open')) updateShop();
  if ($('wM').classList.contains('open') && wOpen && S.lv[wOpen.idx] > 0) { const b = $('upBtn'); if (b && S.lv[wOpen.idx] < 10) b.disabled = S.money < upCost(wOpen); }
}

// =================== START ===================
load();
for (let r = 0; r < S.rooms; r++) buildRoomTracked(r);
roomGroups.forEach(g => { g.scale.y = 1; g.userData.grow = 1; });
rebuildObstacles(); rebuildWalls(); rebuildGrid();
player = makePlayer(); syncInterns(); refreshPads(); resize(); drawTV();
for (let i = 0; i < 3; i++) { spawnCustomer(); const cu = customers[i]; cu.x = CSPOTS[i].x; cu.z = CSPOTS[i].z; cu.wp = []; cu.rot = Math.PI; }
camT.set(player.x, 0, player.z);
$('loading').remove();
if (offlineGain > 0) { $('offTxt').innerHTML = `Seus estagiários continuaram entregando projetos enquanto você estava fora.<br><br><b style="font-size:26px;color:#ffe066">+${fmt(offlineGain)}</b>`; openM('offM'); }
document.addEventListener('visibilitychange', () => { if (document.hidden && !window.__noSave) save(); });
window.addEventListener('pagehide', () => { if (!window.__noSave) save(); });
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); sync(dt); hud(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__game = { step: (sec) => { for (let i = 0; i < sec * 20; i++) { update(0.05); } sync(0.05); }, S, get player() { return player; }, keys, TR, WK, desk, get inbox() { return inbox; }, expand, refreshPads, buildWorker, SEATS, checkTypes, syncInterns, interns: () => interns };
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }
</script>
